[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
wearCompose = "1.6.2"
androidxTestRunner = "1.7.0"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
ksp = "2.3.12"
room = "2.8.5"
tink = "1.24.0"
coroutines = "1.11.0"
