name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0"

      # Uses the committed wrapper (validated by setup-gradle) so CI runs the same Gradle as local.
      - uses: gradle/actions/setup-gradle@v4

      - name: Full Android quality gate (tests, coverage, lint; incl. Wear OS)
        run: ./gradlew qualityCheck

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      - name: Unit tests and coverage
        run: uv run pytest

      - name: Dependency audit
        run: uv run pip-audit
