name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0"

      # Uses the committed wrapper (validated by setup-gradle) so CI runs the same Gradle as local.
      - uses: gradle/actions/setup-gradle@v4

      - name: Full Android quality gate (tests, coverage, lint; incl. Wear OS)
        run: ./gradlew qualityCheck

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tests run against real PostgreSQL (SKIP LOCKED, partial indexes, arrays).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidm
          POSTGRES_PASSWORD: aidm-ci-only
          POSTGRES_DB: aidm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://aidm:aidm-ci-only@localhost:5432/aidm_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      - name: Unit tests and coverage
        run: uv run pytest

      - name: Dependency audit
        run: uv run pip-audit
