name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0"

      # Uses the committed wrapper (validated by setup-gradle) so CI runs the same Gradle as local.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Full Android quality gate (tests, coverage, lint; incl. Wear OS)
        run: ./gradlew qualityCheck

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    # Tests run against real PostgreSQL (SKIP LOCKED, partial indexes, arrays).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidm
          POSTGRES_PASSWORD: aidm-ci-only
          POSTGRES_DB: aidm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://aidm:aidm-ci-only@localhost:5432/aidm_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra dev

      - name: Verify generated OpenAPI v1 snapshot
        run: uv run python -m app.openapi_artifact --check

      - name: Reject breaking OpenAPI changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline_ref="origin/$PR_BASE_REF"
          else
            baseline_ref="$EVENT_BEFORE"
          fi
          if [[ -z "$baseline_ref" || "$baseline_ref" =~ ^0+$ ]]; then
            echo "No prior API baseline; skipping compatibility comparison."
            exit 0
          fi
          baseline_file="$RUNNER_TEMP/openapi-v1-baseline.json"
          if ! git show "${baseline_ref}:docs/api/openapi.v1.json" 2>/dev/null > "$baseline_file"; then
            echo "No prior OpenAPI snapshot; accepting the initial v1 baseline."
            exit 0
          fi
          uv run python -m app.openapi_compat "$baseline_file" ../docs/api/openapi.v1.json

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      - name: Unit tests and coverage
        run: uv run pytest

      - name: Dependency audit
        run: uv run pip-audit

      - name: Generate SBOM (CycloneDX)
        if: matrix.python-version == '3.13'
        run: uv run pip-audit --format cyclonedx-json --output sbom.cdx.json

      - name: Upload SBOM artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sbom
          path: backend/sbom.cdx.json
          retention-days: 90

  website:
    name: Website and web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web app unit tests
        run: node --test website/app/test/helpers.test.mjs

      - name: CLI tests
        run: cd interfaces/cli && python3 -m unittest test_adm

      - name: Image builds and its nginx config is valid
        run: |
          docker build -t adm-web website
          docker run --rm adm-web nginx -t
