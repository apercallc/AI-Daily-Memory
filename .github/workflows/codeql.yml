name: CodeQL Manual

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-interpreted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile debug phone and Wear OS variants
        # --no-build-cache: the regular CI workflow runs on the same push and can populate the
        # Gradle build cache first; a cache hit here means the compiler never actually runs, and
        # CodeQL's tracer (which hooks compiler invocations, not Gradle task execution) then
        # analyzes nothing ("no source code seen during build").
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache :apps:android:assembleDebug :apps:wear:assembleDebug
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
