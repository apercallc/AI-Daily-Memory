[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "ai-daily-memory-backend"
version = "0.1.0"
description = "Backend for AI Daily Memory"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.16,<2.0",
  "botocore>=1.40,<2.0",
  "cryptography>=50,<52",  # HPKE (RFC 9180) module
  "fastapi>=0.116,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0.40,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "botocore-stubs>=1.40,<2.0",
  "httpx>=0.28,<1.0",
  "mypy>=2.3,<3.0",
  "pip-audit>=2.9,<3.0",
  "pytest>=9.1,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's asyncio layer runs driver calls in greenlets; without this, code after an
# `await session...` is silently reported as uncovered.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "ASYNC", "C4", "N", "PERF", "PT", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
